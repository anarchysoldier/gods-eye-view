name: HAK - automatsko osvjezavanje
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hak-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preuzmi i provjeri HAK podatke
        run: python scripts/update_hak.py
      - name: Spremi samo podatkovnu datoteku
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- croatia/data/hak-promet.geojson
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Osvjezi HAK radove i zatvaranja'
          git push origin HEAD:${{ github.event.repository.default_branch }}
